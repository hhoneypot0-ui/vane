plugins { id 'com.android.application' }

android {
    namespace 'com.vane.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.vane.browser"
        minSdk 23
        targetSdk 34
        versionCode 348
        versionName "1.86.8"
        resConfigs "zh", "en"
    }

    buildTypes {
        debug { applicationIdSuffix "" ; minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 按 ABI 拆包：每个包只带自己的内核，arm64 约 31MB、arm32 约 30MB
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions { resources.excludes += ['META-INF/*'] }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
