<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>播放器</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif;overflow:hidden}
  #wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;background:#000;outline:none}
  #bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000c);display:flex;flex-direction:column;gap:6px;transition:opacity .25s}
  #bar.hide{opacity:0;pointer-events:none}
  .row{display:flex;align-items:center;gap:10px}
  #speedWrap{display:none;position:absolute;left:0;right:0;bottom:64px;padding:10px 16px;
    background:#000c;border-radius:12px;align-items:center;gap:10px}
  #speedWrap.on{display:flex}
  #speedWrap span{color:#fff;font-size:12px;min-width:44px}
  #speedWrap input{flex:1}
  button{background:#ffffff1a;border:0;color:#eee;border-radius:8px;padding:6px 10px;font-size:13px}
  button:active{background:#ffffff33}
  #seek{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:#ffffff33;outline:none}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
  .time{font-variant-numeric:tabular-nums;font-size:12px;color:#bbb}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:24px;text-align:center;color:#ccc}
  #msg code{font-size:11px;color:#888;word-break:break-all}
  #center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;opacity:.85;pointer-events:none;transition:opacity .2s}
  .hidden{display:none!important}
body.locked #bar,body.locked #center{pointer-events:none;opacity:.25}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline webkit-playsinline preload="metadata"></video>
  <div id="center">▶</div>
  <div id="msg"><div id="msgtext">正在加载…</div><code id="msgsrc"></code></div>
  <div id="bar">
    <div class="row">
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span class="time" id="t">00:00 / 00:00</span>
    </div>
    <div class="row">
      <button id="back10">−10s</button>
      <button id="play">▶</button>
      <button id="fwd10">+10s</button>
      <button id="mute">🔊</button>
      <button id="speed">1.0x</button>
      <div id="speedWrap"><span id="speedVal">1.0x</span><input id="speedRange" type="range" min="0.1" max="16" step="0.1" value="1"></div>
      <button id="pip">⧉</button>
      <button id="lock">🔒</button>
      <button id="fs">⛶</button>
      <button id="reload">⟳</button>
    </div>
  </div>
</div>
<script src="hls.min.js"></script>
<script>
  (function(){
    var t=null, base=1, hold=false;
    var stage=document.getElementById('wrap');
    function start(e){
      if(document.body.classList.contains('locked')) return;
      hold=false;
      t=setTimeout(function(){
        hold=true; base=v.playbackRate||1; v.playbackRate=2;
        var tip=document.getElementById('rateTip');
        if(!tip){tip=document.createElement('div');tip.id='rateTip';
          tip.style.cssText='position:absolute;left:50%;top:14%;transform:translateX(-50%);'
            +'background:rgba(0,0,0,.62);color:#fff;padding:6px 12px;border-radius:10px;'
            +'font:12px system-ui;z-index:9';
          tip.textContent='2.0x 快进中';document.getElementById('wrap').appendChild(tip);}
        tip.style.display='block';
      },420);
    }
    function end(){
      if(t){clearTimeout(t);t=null;}
      if(hold){
        hold=false; v.playbackRate=base;
        var tip=document.getElementById('rateTip'); if(tip) tip.style.display='none';
      }
    }
    stage.addEventListener('touchstart',start,{passive:true});
    stage.addEventListener('touchend',end,{passive:true});
    stage.addEventListener('touchcancel',end,{passive:true});
  })();

  // 锁定：屏蔽手势与控件，防误触
  document.getElementById('lock').onclick=function(){
    var on=document.body.classList.toggle('locked');
    this.textContent = on ? '🔓' : '🔒';
    var bar=document.getElementById('bar');
    if(bar) bar.style.opacity = on ? '0.25' : '';
  };
</script>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const src = q.get('src') || '';
  const name = q.get('name') || '播放器';
  const referer = q.get('referer') || '';
  const v = document.getElementById('v');
  const bar = document.getElementById('bar');
  const seek = document.getElementById('seek');
  const tEl = document.getElementById('t');
  const center = document.getElementById('center');
  const msg = document.getElementById('msg');
  const msgtext = document.getElementById('msgtext');
  const msgsrc = document.getElementById('msgsrc');
  let hls = null, rates = [0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4], ri = 2, hideTimer = null;

  function fail(text, detail){
    msg.style.display = 'flex';
    msgtext.textContent = text;
    msgsrc.textContent = detail || src;
  }
  function fmt(s){
    if (!isFinite(s)) return '00:00';
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s/60), ss = s%60;
    return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
  }
  function showBar(){
    bar.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ if(!v.paused) bar.classList.add('hide'); }, 3000);
  }
  document.addEventListener('click', function(){ if(!document.body.classList.contains('locked')) showBar(); });

  if (!src) { fail('没有拿到播放地址'); return; }
  document.title = name;
  // 记住上次用的倍速
  try {
    var savedRate = parseFloat(localStorage.getItem('vaneRate') || '1');
    if (savedRate > 0.1 && savedRate <= 16) {
      v.playbackRate = savedRate;
      // 让倍速按钮上显示的就是沿用的值
      for (var k = 0; k < rates.length; k++) if (Math.abs(rates[k] - savedRate) < 0.01) ri = k;
      var sp = document.getElementById('speed');
      if (sp) sp.textContent = savedRate.toFixed(2).replace(/0$/,'') + 'x';
    }
  } catch (e) {}

  const isHls = /\.m3u8(\?|#|$)/i.test(src) || src.indexOf('m3u8') > -1;
  const isDash = /\.mpd(\?|#|$)/i.test(src);

  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: false, maxBufferLength: 30 });
    hls.loadSource(src);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ v.play().catch(function(){}); });
    hls.on(Hls.Events.ERROR, function(e, data){
      if (data && data.fatal) {
        if (data.type === 'networkError') { try { hls.startLoad(); return; } catch(x){} }
        fail('这个流打不开（' + data.details + '）', src);
      }
    });
  } else if (isHls && v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = src;
    v.play().catch(function(){});
  } else {
    v.src = src;
    v.load();
    v.play().catch(function(){ /* 等用户点一下 */ });
  }

  v.addEventListener('loadedmetadata', function(){
    msg.style.display = 'none';
    // 恢复上次进度
    try {
      var saved = parseFloat(localStorage.getItem('pos:' + src) || '0');
      if (saved > 5 && isFinite(v.duration) && v.duration - saved > 10) v.currentTime = saved;
    } catch (e) {}
  });
  setInterval(function(){
    try { if (v.currentTime > 5 && !v.seeking) localStorage.setItem('pos:' + src, String(v.currentTime)); } catch (e) {}
  }, 5000);
  v.addEventListener('timeupdate', function(){
    if (v.duration && isFinite(v.duration)) {
      seek.value = Math.floor(v.currentTime / v.duration * 1000);
      tEl.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
    }
  });
  v.addEventListener('playing', function(){ center.classList.add('hidden'); showBar(); document.getElementById('play').textContent='❚❚'; });
  v.addEventListener('pause', function(){ center.classList.remove('hidden'); document.getElementById('play').textContent='▶'; bar.classList.remove('hide'); });
  v.addEventListener('error', function(){ fail('播放失败：格式不支持或地址失效', src); });
  v.addEventListener('waiting', function(){ msg.style.display='flex'; msgtext.textContent='缓冲中…'; });

  seek.addEventListener('input', function(){ if (v.duration) v.currentTime = v.duration * seek.value / 1000; });
  document.getElementById('play').onclick = function(){ if (v.paused) v.play(); else v.pause(); };
  document.getElementById('mute').onclick = function(){ v.muted = !v.muted; this.textContent = v.muted ? '🔇' : '🔊'; };
  document.getElementById('reload').onclick = function(){ location.reload(); };
  // 全屏手势：横滑调进度、左竖滑调亮度、右竖滑调音量
  (function(){
    var stage = document.getElementById('stage') || document.body;
    var sx=0, sy=0, st=0, mode='', startVol=0, startBright=100;
    function applyBright(v){ document.body.style.filter = 'brightness(' + v + '%)'; }
    stage.addEventListener('touchstart', function(e){
      if (e.touches.length!==1) return;
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=v.currentTime;
      mode=''; startVol = (v.volume===undefined?1:v.volume)*100; startBright=100;
    }, {passive:true});
    stage.addEventListener('touchmove', function(e){
      if (e.touches.length!==1) return;
      var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      if(!mode){
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>18) mode='seek';
        else if(Math.abs(dy)>18) mode = (sx < window.innerWidth/2 ? 'bright':'vol');
      }
      if(mode==='seek'){ v.currentTime = Math.max(0, st + dx/6); }
      else if(mode==='bright'){ applyBright(Math.max(20, Math.min(100, startBright + dy/4))); }
      else if(mode==='vol'){ var vol=Math.max(0, Math.min(1, (startVol + dy/3)/100)); v.volume=vol; v.muted = vol<=0.01; }
    }, {passive:true});
    stage.addEventListener('touchend', function(){ mode=''; }, {passive:true});
  })();

  document.getElementById('back10').onclick = function(){ v.currentTime = Math.max(0, v.currentTime - 10); };
  document.getElementById('fwd10').onclick = function(){ v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10); };
  var speedWrap = document.getElementById('speedWrap');
  var speedRange = document.getElementById('speedRange');
  var speedVal = document.getElementById('speedVal');
  speedRange.oninput = function(){ v.playbackRate = parseFloat(speedRange.value); speedVal.textContent = parseFloat(speedRange.value).toFixed(1)+'x'; };
  longPress(document.getElementById('speed'), function(){ speedWrap.classList.toggle('on'); }, 500);
  function longPress(el, fn, ms){
    var timer;
    el.addEventListener('touchstart', function(){ timer = setTimeout(fn, ms||500); }, {passive:true});
    ['touchend','touchmove','touchcancel'].forEach(function(e){ el.addEventListener(e, function(){ clearTimeout(timer); }, {passive:true}); });
  }
  document.getElementById('speed').onclick = function(){
    ri = (ri + 1) % rates.length;
    v.playbackRate = rates[ri];
    try{ localStorage.setItem('vaneRate', String(rates[ri])); }catch(e){}   // 下次打开沿用
    this.textContent = rates[ri].toFixed(2).replace(/0$/,'') + 'x';
  };
  document.getElementById('fs').onclick = function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (v.requestFullscreen) v.requestFullscreen();
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  };
  window.setRate = function(r){ try{localStorage.setItem('vaneRate', String(r));}catch(e){} v.playbackRate = r; document.getElementById('speed').textContent = r.toFixed(1)+'x'; };

  // 长按 2 倍速（松开还原）
  var boostTimer = null, oldRate = 1;
  function boostStart(){
    oldRate = v.playbackRate;
    v.playbackRate = 2;
    clearTimeout(boostTimer);
    boostTimer = setTimeout(boostEnd, 8000);
    document.getElementById('speed').textContent = '2.0x 加速中';
  }
  function boostEnd(){
    clearTimeout(boostTimer);
    v.playbackRate = oldRate;
    document.getElementById('speed').textContent = oldRate.toFixed(1) + 'x';
  }
  [['mousedown','mouseup'],['touchstart','touchend']].forEach(function(pair){
    v.addEventListener(pair[0], function(e){ if (pair[0]==='touchstart') { boostTimer = setTimeout(boostStart, 350); } });
    v.addEventListener(pair[1], function(){ if (boostTimer) { clearTimeout(boostTimer); } boostEnd(); });
  });

  // 画中画（交给原生）
  document.getElementById('pip').onclick = function(){
    if (window.VanePlayer && VanePlayer.pip) VanePlayer.pip();
    else if (v.requestPictureInPicture) v.requestPictureInPicture();
  };

  // 双击左右跳 10 秒
  let lastTap = 0;
  v.addEventListener('click', function(e){
    const now = Date.now();
    if (now - lastTap < 300) {
      const x = e.clientX;
      if (x < window.innerWidth * 0.35) v.currentTime -= 10;
      else if (x > window.innerWidth * 0.65) v.currentTime += 10;
      showBar();
    }
    lastTap = now;
  });
})();
</script>
</body>
</html>
