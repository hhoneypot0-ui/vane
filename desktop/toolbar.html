<!doctype html><meta charset="utf-8">
<title>Vane toolbar</title>
<style>
  :root{--bg:#101114;--fg:#e8eaed;--sub:#9aa0a6;--field:#1c1e23;--line:#2a2d33;--accent:#8ab4ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,"Microsoft YaHei",sans-serif;height:100vh;overflow:hidden;user-select:none}
  .bar{display:flex;align-items:center;gap:6px;padding:8px 10px}
  button{background:transparent;border:0;color:var(--sub);width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer}
  button:hover{background:#1f2229;color:var(--fg)}
  button:disabled{opacity:.35;cursor:default}
  input{flex:1;min-width:0;background:var(--field);border:1px solid transparent;border-radius:16px;
        padding:8px 14px;color:var(--fg);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:rgba(138,180,255,.55);box-shadow:0 0 0 3px rgba(138,180,255,.14)}
  .tag{color:var(--sub);font-size:11px;padding:0 6px;white-space:nowrap}
  .tabs{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{display:flex;align-items:center;gap:6px;max-width:180px;padding:5px 8px;border-radius:8px;
       background:#16181d;color:var(--sub);font-size:12px;cursor:pointer;white-space:nowrap}
  .tab.active{background:#23252a;color:var(--fg)}
  .tab span{overflow:hidden;text-overflow:ellipsis}
  .tab i{font-style:normal;opacity:.6}
  .plus{background:#16181d;border-radius:8px;width:26px;height:26px;line-height:26px;text-align:center;color:var(--sub);cursor:pointer}
</style>
<div class="bar">
  <button id="back" title="后退 (Alt+←)">‹</button>
  <button id="fwd" title="前进 (Alt+→)">›</button>
  <button id="reload" title="刷新 (F5)">⟳</button>
  <button id="home" title="主页">⌂</button>
  <input id="addr" spellcheck="false" placeholder="搜索或输入网址">
  <span class="tag" id="rules"></span>
  <span class="tag" id="ver" title="版本"></span>
  <button id="proxy" title="设置代理">⚙</button>
</div>
<div class="tabs" id="tabs"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let state = { url:'', canBack:false, canForward:false, tabs:[], rules:0 };

  window.vane.onState((s) => {
    state = s;
    if (document.activeElement !== $('addr')) $('addr').value = s.url === 'vane://home' ? '' : s.url;
    $('back').disabled = !s.canBack;
    $('fwd').disabled = !s.canForward;
    $('rules').textContent = s.rules ? s.rules.toLocaleString() + ' 条规则' : '';
    $('ver').textContent = s.version ? 'v' + s.version : '';
    const box = $('tabs'); box.innerHTML = '';
    s.tabs.forEach((t, i) => {
      const d = document.createElement('div');
      d.className = 'tab' + (t.active ? ' active' : '');
      const n = document.createElement('span'); n.textContent = t.title || '新标签页';
      d.appendChild(n);
      if (s.tabs.length > 1) {
        const x = document.createElement('i'); x.textContent = '✕';
        x.onclick = (e) => { e.stopPropagation(); window.vane.closeTab(); };
        d.appendChild(x);
      }
      d.onclick = () => window.vane.setActive && window.vane.setActive(i);
      box.appendChild(d);
    });
    const plus = document.createElement('div'); plus.className = 'plus'; plus.textContent = '+';
    plus.onclick = () => window.vane.newTab(); box.appendChild(plus);
  });

  $('back').onclick = () => window.vane.back();
  $('fwd').onclick = () => window.vane.forward();
  $('reload').onclick = () => window.vane.reload();
  $('home').onclick = () => window.vane.home();
  $('addr').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { window.vane.navigate($('addr').value); $('addr').blur(); }
    if (e.key === 'Escape') $('addr').blur();
  });
  $('proxy').onclick = () => {
    const cur = localStorage.getItem('vane-proxy') || '';
    const v = prompt('代理（留空=直连，例：socks5://127.0.0.1:1080 或 http://127.0.0.1:7890）', cur);
    if (v === null) return;
    localStorage.setItem('vane-proxy', v.trim());
    window.vane.setProxy(v.trim());
  };
  document.addEventListener('keydown', (e) => {
    if (e.altKey && e.key === 'ArrowLeft') window.vane.back();
    if (e.altKey && e.key === 'ArrowRight') window.vane.forward();
    if (e.key === 'F5') window.vane.reload();
    if (e.ctrlKey && e.key === 't') window.vane.newTab();
    if (e.ctrlKey && e.key === 'w') window.vane.closeTab();
    if (e.ctrlKey && e.key === 'l') { $('addr').focus(); $('addr').select(); }
  });
</script>
