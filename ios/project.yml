# XcodeGen 用：xcodegen generate 之后用 Xcode 打开 Vane.xcodeproj
name: Vane
options:
  bundleIdPrefix: com.vane
targets:
  Vane:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Vane
      - path: Vane/Rules
        type: folder
        name: Rules
      - path: ../app/src/main/assets
        type: folder
        name: assets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vane.browser
        INFOPLIST_FILE: Vane/Info.plist
  # 代理扩展：需要付费开发者账号，且在 Apple 后台为该 App ID 勾选 Network Extensions
  VaneProxy:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: VaneProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vane.browser.proxy
        CODE_SIGN_ENTITLEMENTS: VaneProxy/VaneProxy.entitlements
        INFOPLIST_FILE: VaneProxy/Info.plist
