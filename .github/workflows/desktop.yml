name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run dist:win
            artifact: vane-windows
          - os: ubuntu-latest
            script: npx electron-builder --linux AppImage dir --x64 --publish never
            artifact: vane-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install
      - name: 打包
        run: ${{ matrix.script }}
      # Windows 产物同步进主 Release（v1.86.3），方便一处下载全平台
      - name: 同步到主 Release
        if: matrix.artifact == 'vane-windows'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.86.3
          fail_on_unmatched_files: false
          files: |
            desktop/dist/Vane.Setup.*.exe
            desktop/dist/Vane.*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.yml
          if-no-files-found: warn

      # 直接挂到 Release：tag 触发挂到对应 tag，手动触发挂到 desktop-latest
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Vane 桌面版（最新构建）' }}
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
