<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autofill Test</title>
<style>body{font:16px system-ui;padding:24px}input{display:block;width:100%;padding:10px;margin:8px 0;box-sizing:border-box}</style>
<h2>登录测试 / Autofill Probe</h2>
<form id="f"><input id="u" name="username" placeholder="用户名" autocomplete="username">
<input id="p" name="password" type="password" placeholder="密码" autocomplete="current-password">
<button type="submit">登录</button></form>
<div id="out" style="margin-top:16px;color:#555">未提交</div>
<script>
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
document.getElementById('out').textContent='提交: '+document.getElementById('u').value+' / '+(document.getElementById('p').value?'已填密码':'空密码');});
setTimeout(function(){var u=document.getElementById('u'),p=document.getElementById('p');
var o=document.getElementById('out');if(o)o.textContent='AUTOFILL u='+(u.value?u.value.length:0)+' p='+(p.value?p.value.length:0);},1500);
</script>
